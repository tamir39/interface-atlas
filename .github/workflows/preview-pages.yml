name: Publish live previews

on:
  push:
    branches: [main]
    paths:
      - 'assets/brand/**'
      - 'themes/*/preview/**'
      - 'styles/*/preview/**'
      - 'tools/style-catalog.mjs'
      - 'tools/style-tokens.mjs'
      - 'catalog/**'
      - 'site/**'
      - 'tools/build-preview-site.mjs'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Check discovery and style reference tokens
        run: |
          node tools/catalog.mjs --check
          node tools/style-catalog.mjs --check
          node tools/style-tokens.mjs --check
      - name: Build the preview site
        run: node tools/build-preview-site.mjs
      - name: Upload only the preview site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy live previews
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
